name: arp_feds
channels:
  - conda-forge
dependencies:
  - python=3.11
  # --- core scientific ---
  - numpy=1.26.*
  - pandas=2.2.*
  # --- app & viz ---
  - streamlit=1.36.*
  - altair=5.3.*
  - matplotlib=3.9.*           # plotting support
  # --- config & files ---
  - python-dotenv=1.0.*
  # --- nlp & matching ---
  - pysbd=0.3.4
  - rapidfuzz=3.9.*
  - spacy=3.7.*
  - spacy-lookups-data=1.0.*
  # --- ml ---
  - scikit-learn=1.5.*
  - pytorch=2.4.*              # CPU builds for macOS (Intel/ARM) & Windows
  - transformers=4.44.*
  - sentencepiece=0.1.99
  # --- api ---
  - openai=1.40.*
  - httpx=0.27.*
  # --- dev experience ---
  - tqdm=4.66.*
  # --- notebooks / ipynb ---
  - jupyterlab=4.2.*
  - ipykernel=6.29.*
  # --- pip for extras / wheels that are more portable ---
  - pip
  - pip:
      - PyMuPDF==1.24.10
